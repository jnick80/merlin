name: Release CypherLink

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Package CypherLink release asset
        run: |
          mkdir -p release
          zip -r release/CypherLink.zip dist node_modules package.json package-lock.json README.md .env.example

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CypherLink ${{ inputs.tag || github.ref_name }}
          files: release/CypherLink.zip
          generate_release_notes: true
