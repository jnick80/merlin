name: Python source checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**/*.py"
      - "tests/test_python_sources.py"
      - ".github/workflows/python-package.yml"
  push:
    branches: ["main"]
    paths:
      - "app/**/*.py"
      - "tests/test_python_sources.py"
      - ".github/workflows/python-package.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Verify Python sources compile
        run: pytest tests/test_python_sources.py -q
